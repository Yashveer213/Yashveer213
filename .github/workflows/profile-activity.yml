name: Refresh profile activity

on:
  push:
    branches: [main]
    paths:
      - scripts/update_activity.py
      - .github/workflows/profile-activity.yml
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate activity artwork
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/update_activity.py

      - name: Save the refreshed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/activity.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh profile activity [skip ci]'
          git push
